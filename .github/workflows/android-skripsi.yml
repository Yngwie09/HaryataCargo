name: APK skripsi
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
      - name: Buat APK pengujian skripsi
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://haryata-api-production.up.railway.app' }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY"
          flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: SHA-1 APK untuk pembatasan Google Maps
        run: keytool -list -v -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android
      - uses: actions/upload-artifact@v4
        with:
          name: haryata-cargo-skripsi-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
