name: Android release
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Write signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
      - name: Build signed ARM64 APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://haryata-api-production.up.railway.app' }}
        run: flutter build apk --release --no-pub --target-platform android-arm64 --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: haryata-cargo-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
