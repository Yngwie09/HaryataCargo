name: PostgreSQL backend checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cargo
          POSTGRES_PASSWORD: cargo_ci_only
          POSTGRES_DB: haryata_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cargo -d haryata_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://cargo:cargo_ci_only@localhost:5432/haryata_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Migration can run twice without losing schema
        working-directory: backend
        run: |
          npm run migrate
          npm run migrate
