name: haryata_cargo
description: "Manajemen pengiriman dan bukti serah terima PT. Haryata Cargo."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  csv: ^6.0.0
  file_saver: ^0.2.14
  shared_preferences: ^2.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  config:
    enable-windows-desktop: false
    enable-linux-desktop: false
    enable-macos-desktop: false

  uses-material-design: true
